<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Salem Dominion Ministries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        
        .offline-icon {
            font-size: 4rem;
            color: #fbbf24;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        .offline-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fbbf24;
        }
        
        .offline-message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .retry-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        
        .retry-btn:hover {
            background: #f59e0b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .connection-status {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        
        <h1 class="offline-title">You're Offline</h1>
        
        <p class="offline-message">
            It looks like you're not connected to the internet. 
            Please check your connection and try again.
        </p>
        
        <button class="btn retry-btn" onclick="window.location.reload()">
            <i class="fas fa-sync-alt me-2"></i>Retry Connection
        </button>
        
        <div class="connection-status">
            <span class="status-indicator"></span>
            <span id="connection-text">Checking connection...</span>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                <i class="fas fa-info-circle me-1"></i>
                Some cached content may still be available
            </small>
        </div>
    </div>
    
    <script>
        // Check connection status periodically
        function checkConnection() {
            const statusText = document.getElementById('connection-text');
            const statusIndicator = document.querySelector('.status-indicator');
            
            if (navigator.onLine) {
                statusText.textContent = 'Connection restored! Redirecting...';
                statusIndicator.style.background = '#10b981';
                setTimeout(() => {
                    window.location.href = 'index.php';
                }, 2000);
            } else {
                statusText.textContent = 'No internet connection';
                statusIndicator.style.background = '#ef4444';
            }
        }
        
        // Check connection every 3 seconds
        setInterval(checkConnection, 3000);
        
        // Initial check
        checkConnection();
        
        // Listen for online/offline events
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
    </script>
</body>
</html>
